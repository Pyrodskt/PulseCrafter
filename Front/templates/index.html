<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseCrafter - Music Library</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a202c; }
        ::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        .filter-dropdown-content { max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased">
    <div class="container mx-auto p-4 md:p-8">
        <nav class="bg-gray-800 p-4 rounded-lg mb-8 flex justify-center space-x-4">
            <a href="/" class="text-white bg-gray-900 px-3 py-2 rounded-md text-sm font-medium" aria-current="page">Musiques</a>
            <a href="/groups" class="text-white hover:bg-gray-700 px-3 py-2 rounded-md text-sm font-medium">Groupes</a>
        </nav>

        <h1 class="text-4xl font-extrabold text-white mb-8 text-center">PulseCrafter - Ma Bibliothèque Musicale</h1>

        <div class="bg-gray-800 shadow-lg rounded-lg overflow-hidden">
            <div class="p-4 bg-gray-700 border-b border-gray-600">
                <h2 class="text-2xl font-semibold text-white">Filtres</h2>
            </div>

            <!-- Filtres -->
            <div class="p-4 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-4 bg-gray-700/50">
                <!-- Text Filters -->
                <input type="text" id="filter-id" placeholder="ID..." class="bg-gray-800 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                <input type="text" id="filter-nom_fichier" placeholder="Nom..." class="bg-gray-800 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                <input type="text" id="filter-bpm" placeholder="BPM..." class="bg-gray-800 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                <input type="text" id="filter-punchiness" placeholder="Punch..." class="bg-gray-800 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">

                <!-- Checkbox Filters -->
                <div id="filter-artiste-dropdown" class="relative"></div>
                <div id="filter-genre-dropdown" class="relative"></div>
                <div id="filter-cle_musicale-dropdown" class="relative"></div>
                <div id="filter-type_de_basse-dropdown" class="relative"></div>
            </div>
            
            <div class="overflow-x-auto relative shadow-md sm:rounded-lg max-h-[65vh]">
                <table class="w-full text-sm text-left text-gray-400">
                    <thead class="text-xs text-gray-300 uppercase bg-gray-700 sticky top-0">
                        <tr>
                            <th scope="col" class="py-3 px-6">ID</th>
                            <th scope="col" class="py-3 px-6">Nom Fichier</th>
                            <th scope="col" class="py-3 px-6">BPM</th>
                            <th scope="col" class="py-3 px-6">Punchiness</th>
                            <th scope="col" class="py-3 px-6">Artiste</th>
                            <th scope="col" class="py-3 px-6">Genre</th>
                            <th scope="col" class="py-3 px-6">Clé Musicale</th>
                            <th scope="col" class="py-3 px-6">Type de Basse</th>
                            <th scope="col" class="py-3 px-6">Action</th> <!-- New column -->
                        </tr>
                    </thead>
                    <tbody id="music-table-body">
                        <tr class="bg-gray-800 border-b border-gray-700"><td colspan="9" class="py-4 px-6 text-center text-gray-400">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Music Details Modal -->
    <div id="details-modal" class="fixed inset-0 bg-black bg-opacity-70 z-50 items-center justify-center hidden">
        <div class="bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-2xl m-4" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center border-b border-gray-600 pb-3 mb-4">
                <h3 class="text-2xl font-bold text-white" id="modal-title">Détails de la Musique</h3>
                <button onclick="hideDetails()" class="text-gray-400 hover:text-white text-3xl leading-none">&times;</button>
            </div>
            <div id="modal-content" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-gray-300">
                <!-- Details will be populated here -->
            </div>
            <div class="mt-6">
                <audio id="modal-audio-player" controls class="w-full"></audio>
            </div>
            <div class="flex justify-end mt-6">
                <button onclick="hideDetails()" class="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded-lg text-white font-semibold">Fermer</button>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const musicTableBody = document.getElementById('music-table-body');
        let allMusics = [];
        const textFilters = {
            id: document.getElementById('filter-id'),
            nom_fichier: document.getElementById('filter-nom_fichier'),
            bpm: document.getElementById('filter-bpm'),
            punchiness: document.getElementById('filter-punchiness'),
        };
        const checkboxFilterConfigs = {
            artiste: { containerId: 'filter-artiste-dropdown', property: 'artiste.nom', label: 'Artistes' },
            genre: { containerId: 'filter-genre-dropdown', property: 'genre.nom', label: 'Genres' },
            cle_musicale: { containerId: 'filter-cle_musicale-dropdown', property: 'cle_musicale.nom', label: 'Clés' },
            type_de_basse: { containerId: 'filter-type_de_basse-dropdown', property: 'type_de_basse.nom', label: 'Basses' },
        };

        const modal = document.getElementById('details-modal');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const audioPlayer = document.getElementById('modal-audio-player');

        // Modal functions
        window.showDetails = function(musicId) {
            const music = allMusics.find(m => m.id === musicId);
            if (!music) {
                console.error('Musique non trouvée pour ID:', musicId);
                return;
            }

            modalTitle.textContent = music.nom_fichier;
            modalContent.innerHTML = `
                <div><strong class="text-gray-400">ID:</strong> ${music.id}</div>
                <div><strong class="text-gray-400">Artiste:</strong> ${music.artiste?.nom ?? 'N/A'}</div>
                <div><strong class="text-gray-400">Genre:</strong> ${music.genre?.nom ?? 'N/A'}</div>
                <div><strong class="text-gray-400">Clé:</strong> ${music.cle_musicale?.nom ?? 'N/A'}</div>
                <div><strong class="text-gray-400">BPM:</strong> ${music.bpm ?? 'N/A'}</div>
                <div><strong class="text-gray-400">Punchiness:</strong> ${music.punchiness?.toFixed(2) ?? 'N/A'}</div>
                <div class="md:col-span-2"><strong class="text-gray-400">Type de Basse:</strong> ${music.type_de_basse?.nom ?? 'N/A'}</div>
            `;
            
            // Assuming music files are in /static/music/
            audioPlayer.src = `/static/music/${music.nom_fichier}`;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.hideDetails = function() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        modal.addEventListener('click', hideDetails);


        window.addToPlaylist = function(musicId) {
            console.log('Ajouter à la playlist la musique ID:', musicId);
            // Implement actual add to playlist logic here
        };

        function renderTable(musics) {
            musicTableBody.innerHTML = '';
            if (musics.length === 0) {
                musicTableBody.innerHTML = `<tr><td colspan="9" class="py-4 px-6 text-center text-gray-400">Aucun résultat.</td></tr>`;
                return;
            }
            const rows = musics.map(music => `
                <tr class="bg-gray-800 border-b border-gray-700 hover:bg-gray-700">
                    <td class="py-4 px-6 font-medium text-white">${music.id}</td>
                    <td class="py-4 px-6">${music.nom_fichier}</td>
                    <td class="py-4 px-6">${music.bpm ?? 'N/A'}</td>
                    <td class="py-4 px-6">${music.punchiness?.toFixed(2) ?? 'N/A'}</td>
                    <td class="py-4 px-6">${music.artiste?.nom ?? 'N/A'}</td>
                    <td class="py-4 px-6">${music.genre?.nom ?? 'N/A'}</td>
                    <td class="py-4 px-6">${music.cle_musicale?.nom ?? 'N/A'}</td>
                    <td class="py-4 px-6">${music.type_de_basse?.nom ?? 'N/A'}</td>
                    <td class="py-4 px-6 whitespace-nowrap">
                        <button onclick="showDetails(${music.id})" class="font-medium text-blue-600 dark:text-blue-500 hover:underline mr-2">Détails</button>
                        <button onclick="addToPlaylist(${music.id})" class="font-medium text-green-600 dark:text-green-500 hover:underline">Playlist</button>
                    </td>
                </tr>
            `).join('');
            musicTableBody.innerHTML = rows;
        }

        function applyFilters() {
            const textFilterValues = Object.fromEntries(Object.entries(textFilters).map(([key, input]) => [key, input.value.toLowerCase()]));
            
            const checkboxFilterValues = {};
            for (const key in checkboxFilterConfigs) {
                const checked = document.querySelectorAll(`#${checkboxFilterConfigs[key].containerId} input[type="checkbox"]:checked`);
                checkboxFilterValues[key] = Array.from(checked).map(cb => cb.value);
            }

            const filteredMusics = allMusics.filter(music => {
                const textMatch = Object.keys(textFilterValues).every(key => {
                    const val = textFilterValues[key];
                    return !val || String(music[key] ?? '').toLowerCase().includes(val);
                });

                const checkboxMatch = Object.keys(checkboxFilterValues).every(key => {
                    const selectedValues = checkboxFilterValues[key];
                    if (selectedValues.length === 0) return true;
                    
                    const propPath = checkboxFilterConfigs[key].property.split('.');
                    const musicValue = propPath.reduce((obj, part) => obj && obj[part], music);
                    
                    return selectedValues.includes(musicValue);
                });

                return textMatch && checkboxMatch;
            });
            renderTable(filteredMusics);
        }

        function populateFilters(musics) {
            for (const key in checkboxFilterConfigs) {
                const config = checkboxFilterConfigs[key];
                const propPath = config.property.split('.');
                const uniqueValues = [...new Set(musics.map(m => propPath.reduce((obj, part) => obj && obj[part], m)).filter(Boolean))].sort();
                
                const container = document.getElementById(config.containerId);
                const dropdownId = `dropdown-content-${key}`;

                let checkboxesHtml = uniqueValues.map(value => `
                    <label class="flex items-center px-2 py-1 text-white hover:bg-gray-600">
                        <input type="checkbox" class="form-checkbox h-4 w-4 text-blue-500 bg-gray-700 border-gray-500 rounded focus:ring-blue-600" value="${value}">
                        <span class="ml-2 text-sm">${value}</span>
                    </label>
                `).join('');

                container.innerHTML = `
                    <button id="dropdown-btn-${key}" class="w-full bg-gray-800 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5 text-left flex justify-between items-center">
                        <span>${config.label}</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="${dropdownId}" class="hidden absolute z-10 mt-1 w-full bg-gray-800 border border-gray-600 rounded-lg shadow-lg filter-dropdown-content">
                        <div class="p-2">${checkboxesHtml}</div>
                        <button class="w-full text-center py-1 text-sm text-gray-300 hover:bg-gray-700 border-t border-gray-600 clear-btn">Désélectionner</button>
                    </div>
                `;

                document.getElementById(`dropdown-btn-${key}`).addEventListener('click', () => {
                    document.getElementById(dropdownId).classList.toggle('hidden');
                });

                container.querySelector('.clear-btn').addEventListener('click', () => {
                    container.querySelectorAll('input:checked').forEach(cb => cb.checked = false);
                    applyFilters();
                });
            }
             document.addEventListener('change', e => {
                if (e.target.type === 'checkbox') applyFilters();
            });
        }

        async function fetchMusicData() {
            try {
                const response = await fetch('http://localhost:8000/musics/');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                allMusics = await response.json();
                renderTable(allMusics);
                populateFilters(allMusics);

                Object.values(textFilters).forEach(input => input.addEventListener('keyup', applyFilters));

            } catch (error) {
                console.error('Erreur:', error);
                musicTableBody.innerHTML = `<tr><td colspan="9" class="py-4 px-6 text-center text-red-400">Erreur: ${error.message}</td></tr>`;
            }
        }

        fetchMusicData();
    });
    </script>
</body>
</html>
