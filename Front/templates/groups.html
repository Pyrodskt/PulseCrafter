<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseCrafter - Groupes de Musiques</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .tree-container ul { padding-left: 1.5rem; }
        .tree-container li { margin-top: 0.5rem; }
        .tree-node {
            display: flex;
            align-items: center;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }
        .tree-node:hover { background-color: #374151; }
        .tree-node .highlight { background-color: #fbbf24; color: #1f2937; border-radius: 0.2rem; padding: 0.1rem; }
        .arrow {
            cursor: pointer;
            user-select: none;
            margin-right: 0.5rem;
            transition: transform 0.2s;
            width: 1rem;
            height: 1rem;
        }
        .arrow.collapsed { transform: rotate(-90deg); }
        .icon { margin-right: 0.5rem; color: #9ca3af; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased">
    <div class="container mx-auto p-4 md:p-8">
        <nav class="bg-gray-800 p-4 rounded-lg mb-8 flex justify-center space-x-4">
            <a href="/" class="text-white hover:bg-gray-700 px-3 py-2 rounded-md text-sm font-medium">Musiques</a>
            <a href="/groups" class="text-white bg-gray-900 px-3 py-2 rounded-md text-sm font-medium" aria-current="page">Groupes</a>
        </nav>

        <h1 class="text-4xl font-extrabold text-white mb-8 text-center">Explorateur de Groupes</h1>

        <div class="bg-gray-800 shadow-lg rounded-lg overflow-hidden">
            <!-- Search Bar -->
            <div class="p-4 bg-gray-700 border-b border-gray-600">
                <input type="text" id="search-filter" placeholder="Rechercher un groupe..." class="bg-gray-800 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
            </div>
            
            <!-- Tree View Container -->
            <div id="tree-container" class="p-4 tree-container max-h-[70vh] overflow-y-auto">
                <div class="text-center text-gray-400">Chargement de l'arborescence...</div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const treeContainer = document.getElementById('tree-container');
        const searchInput = document.getElementById('search-filter');
        let allGroups = [];

        function buildTree(groups) {
            const map = new Map(groups.map(g => [g.id, { ...g, children: [] }]));
            const roots = [];
            for (const group of map.values()) {
                if (group.parent_id) {
                    const parent = map.get(group.parent_id);
                    if (parent) {
                        parent.children.push(group);
                    } else {
                        roots.push(group); // Orphaned, treat as root
                    }
                } else {
                    roots.push(group);
                }
            }
            return roots;
        }

        function renderTreeNode(node) {
            const hasChildren = node.children.length > 0;
            const childrenHtml = hasChildren ? `<ul class="hidden">${node.children.map(renderTreeNode).join('')}</ul>` : '';
            
            // Simple folder/file icon based on children
            const icon = hasChildren 
                ? `<svg class="icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>`
                : `<svg class="icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>`;

            return `
                <li data-id="${node.id}" data-name="${node.nom}">
                    <div class="tree-node">
                        <span class="arrow ${hasChildren ? 'collapsed' : 'invisible'}">${hasChildren ? '▶' : ''}</span>
                        ${icon}
                        <span class="node-name">${node.nom}</span>
                    </div>
                    ${childrenHtml}
                </li>
            `;
        }

        function filterTree() {
            const query = searchInput.value.toLowerCase();
            if (!query) {
                // Reset tree: collapse all, remove highlights, show all
                treeContainer.querySelectorAll('li').forEach(li => {
                    li.style.display = '';
                    li.querySelector('.node-name').innerHTML = li.dataset.name;
                    const ul = li.querySelector('ul');
                    if (ul) ul.classList.add('hidden');
                    const arrow = li.querySelector('.arrow');
                    if (arrow) arrow.classList.add('collapsed');
                });
                return;
            }

            const allNodes = Array.from(treeContainer.querySelectorAll('li'));
            let matchedIds = new Set();

            // Find nodes that match the query
            allNodes.forEach(li => {
                const nodeName = li.dataset.name.toLowerCase();
                if (nodeName.includes(query)) {
                    // Highlight match
                    const originalName = li.dataset.name;
                    const regex = new RegExp(query, 'gi');
                    const highlightedName = originalName.replace(regex, match => `<span class="highlight">${match}</span>`);
                    li.querySelector('.node-name').innerHTML = highlightedName;
                    
                    // Mark this node and all its parents as visible
                    matchedIds.add(li.dataset.id);
                    let parent = li.parentElement.closest('li');
                    while (parent) {
                        matchedIds.add(parent.dataset.id);
                        parent = parent.parentElement.closest('li');
                    }
                } else {
                     li.querySelector('.node-name').innerHTML = li.dataset.name;
                }
            });

            // Show/hide nodes based on matches
            allNodes.forEach(li => {
                if (matchedIds.has(li.dataset.id)) {
                    li.style.display = '';
                    // Expand parents of matched nodes
                    const ul = li.querySelector('ul');
                    if (ul) {
                         const hasVisibleChild = Array.from(ul.querySelectorAll('li')).some(childLi => matchedIds.has(childLi.dataset.id));
                         if(hasVisibleChild) {
                             ul.classList.remove('hidden');
                             const arrow = li.querySelector('.arrow');
                             if(arrow) arrow.classList.remove('collapsed');
                         }
                    }
                } else {
                    li.style.display = 'none';
                }
            });
        }

        async function initializeTree() {
            try {
                const response = await fetch('http://localhost:8000/groups/all');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                allGroups = await response.json();
                const treeData = buildTree(allGroups);
                
                if(treeData.length === 0) {
                    treeContainer.innerHTML = `<div class="text-center text-gray-400">Aucun groupe trouvé.</div>`;
                    return;
                }
                
                treeContainer.innerHTML = `<ul>${treeData.map(renderTreeNode).join('')}</ul>`;

                treeContainer.addEventListener('click', e => {
                    // Find the closest 'tree-node' element to where the user clicked
                    const treeNode = e.target.closest('.tree-node');
                    if (!treeNode) return; // Exit if the click was not on a node

                    // From the node, find the parent li and the elements to toggle
                    const li = treeNode.parentElement;
                    const arrow = treeNode.querySelector('.arrow');
                    const childrenUl = li.querySelector('ul');

                    // Only proceed if there is an arrow to click and a list to toggle
                    if (arrow && !arrow.classList.contains('invisible') && childrenUl) {
                        arrow.classList.toggle('collapsed');
                        childrenUl.classList.toggle('hidden');
                    }
                });

                searchInput.addEventListener('keyup', filterTree);

            } catch (error) {
                console.error('Erreur:', error);
                treeContainer.innerHTML = `<div class="text-center text-red-400">Erreur: ${error.message}</div>`;
            }
        }

        initializeTree();
    });
    </script>
</body>
</html>
